name: Build and Push Libs Images
on:
  push:
    branches-ignore:
      - none
    paths:
      - "libs/**"
  workflow_dispatch:
jobs:
  build:
    name: Build
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        config:
          - { dockerfile: "libs/Dockerfile", context: "libs", image_name: "libs", tag_name: "latest", platforms: "linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8" }
          - { dockerfile: "libs/Dockerfile.pypy", context: "libs", image_name: "libs", tag_name: "pypy", platforms: "linux/386,linux/amd64,linux/arm64/v8" }
    runs-on: [self-hosted, ubuntu, latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read image version
        id: version
        run: echo "version=$(tr -d '\r\n' < ${{ matrix.config.context }}/VERSION)" >> $GITHUB_OUTPUT
      - name: Set tag names based on branch
        id: set_tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG_NAME=${{ matrix.config.tag_name }}
          if [[ "$TAG_NAME" == "latest" ]]; then
            VERSION_TAG="$VERSION"
          else
            VERSION_TAG="$VERSION-$TAG_NAME"
          fi
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          else
            GITHUB_REFNAME=${{ github.ref_name }}
            BRANCH_NAME=${GITHUB_REFNAME//\//_}
            echo "tag=$TAG_NAME-$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "version_tag=$VERSION_TAG-$BRANCH_NAME" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.config.context }}
          file: ${{ matrix.config.dockerfile }}
          platforms: ${{ matrix.config.platforms }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            hivesolutions/${{ matrix.config.image_name }}:${{ steps.set_tag.outputs.tag }}
            hivesolutions/${{ matrix.config.image_name }}:${{ steps.set_tag.outputs.version_tag }}
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref_name == 'master'
    needs: build
    runs-on: [self-hosted, ubuntu, latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Read image version
        id: version
        run: echo "version=$(tr -d '\r\n' < libs/VERSION)" >> $GITHUB_OUTPUT
      - name: Trigger infra-bemisc deployment
        uses: hivesolutions/deploy-action@v1
        with:
          repository: hivesolutions/infra-bemisc
          service: libs
          group: apps
          tag: ${{ steps.version.outputs.version }}
          token: ${{ secrets.INFRA_DEPLOY_PAT }}
